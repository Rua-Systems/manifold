@if (language$ | async; as current) {
	<div class="switcher" role="group" [attr.aria-label]="'header.language' | translate">
		@for (language of languages; track language) {
			<button
				type="button"
				class="option"
				[class.active]="language === current"
				[attr.aria-pressed]="language === current"
				(click)="select(language)"
			>
				{{ 'language.' + language | translate }}
			</button>
		}
	</div>
}
