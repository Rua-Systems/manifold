<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.dir%" data-theme="%manifold.theme%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<script nonce="%sveltekit.nonce%">
			// Without a theme cookie the server leaves data-theme empty. Pick the theme from the
			// system preference here, before first paint, so the page never flashes the wrong one.
			{
				const root = document.documentElement;
				const theme = root.dataset.theme;
				if (theme !== 'light' && theme !== 'dark') {
					if (matchMedia('(prefers-color-scheme: dark)').matches) {
						root.dataset.theme = 'dark';
					} else {
						root.dataset.theme = 'light';
					}
				}
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
