# Manifold with its PostGIS database. The app is published on 127.0.0.1:3000 for a reverse proxy on
# the same host; docs/deployment.md explains the proxy and a Compose file for Coolify.
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: ghcr.io/justhasanuknow/manifold:${MANIFOLD_VERSION:-latest}
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ORIGIN: ${ORIGIN:?}
      # One reverse proxy in front of the app. Leave both empty to reach the app without a proxy.
      ADDRESS_HEADER: ${ADDRESS_HEADER-x-forwarded-for}
      XFF_DEPTH: ${XFF_DEPTH-1}
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
      ORGANIZATION_NAME: ${ORGANIZATION_NAME:-Manifold}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
      OWNER_USERNAME: ${OWNER_USERNAME:-}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAP_TILE_URL: ${MAP_TILE_URL:-}
      MAP_TILE_ATTRIBUTION: ${MAP_TILE_ATTRIBUTION:-}
      MAP_DEFAULT_CENTER: ${MAP_DEFAULT_CENTER:-}
      MAP_DEFAULT_ZOOM: ${MAP_DEFAULT_ZOOM:-}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-}
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-}
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - app-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ['CMD', 'node', 'healthcheck.mjs']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  db-data:
  app-data:
